name: Deploy Redirect to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Create redirect page
        run: |
          mkdir -p _site
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=https://ai.stanford.edu/~orrzohar/">
            <link rel="canonical" href="https://ai.stanford.edu/~orrzohar/">
            <title>Redirecting to ai.stanford.edu/~orrzohar</title>
          </head>
          <body>
            <p>Redirecting to <a href="https://ai.stanford.edu/~orrzohar/">ai.stanford.edu/~orrzohar</a>...</p>
          </body>
          </html>
          EOF
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

